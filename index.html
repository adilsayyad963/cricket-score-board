<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HT Cricket Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #e8e4d8;
    --surface: #f6f3ea;
    --surface-line: #cfc9b8;
    --ink: #1f1d17;
    --ink-soft: #5d584b;
    --btn: #fffdf7;
    --btn-line: #bdb6a2;
    --board: #14392b;
    --board-deep: #0e2a20;
    --chalk: #f4f0e3;
    --chalk-soft: #b9c8bc;
    --tile: #f4f0e3;
    --tile-ink: #1c1b16;
    --gold: #e3b53f;
    --wicket: #c9452e;
    --frame: #6a4a2c;
    --focus: #1b6fd6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #15130e; --surface: #211e17; --surface-line: #38332a;
      --ink: #f1ede0; --ink-soft: #a9a392; --btn: #2c281f; --btn-line: #4a4436;
      --frame: #4b3520; --focus: #6aa7ff;
    }
  }
  :root[data-theme="dark"] {
    --page: #15130e; --surface: #211e17; --surface-line: #38332a;
    --ink: #f1ede0; --ink-soft: #a9a392; --btn: #2c281f; --btn-line: #4a4436;
    --frame: #4b3520; --focus: #6aa7ff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
    font-size: 17px; line-height: 1.4;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }

  /* ---------- Board ---------- */
  .frame {
    background: var(--frame); padding: 10px; border-radius: 6px;
    box-shadow: 0 10px 24px rgba(0,0,0,.28);
  }
  .board {
    background: var(--board);
    border: 3px solid var(--chalk); outline: 2px solid var(--board-deep); outline-offset: -8px;
    border-radius: 3px; padding: 18px 16px 16px; color: var(--chalk);
  }
  .teams {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 21px; font-weight: 700; letter-spacing: .02em;
  }
  .club {
    margin: 0 0 16px; padding-bottom: 12px; text-align: center;
    font-family: "Alfa Slab One", Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: clamp(26px, 7.5vw, 42px); line-height: 1.1; color: var(--chalk);
    border-bottom: 3px double var(--gold);
  }
  .teams .v { color: var(--chalk-soft); font-weight: 500; }
  .team-input {
    background: transparent; border: 0; border-bottom: 2px dashed transparent;
    color: var(--chalk); font: inherit; width: 9.5em; max-width: 42vw; padding: 2px 0;
  }
  .team-input:hover { border-bottom-color: var(--chalk-soft); }
  .team-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .team-input.batting { border-bottom: 2px solid var(--gold); }
  .innings-tag { margin-left: auto; color: var(--gold); font-size: 17px; }

  .tiles-row { display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 4vw, 34px); margin: 22px 0 14px; flex-wrap: wrap; }
  .group { text-align: center; }
  .group .tiles { display: flex; gap: 5px; justify-content: center; align-items: flex-end; }
  .group .name { margin-top: 8px; color: var(--chalk-soft); font-size: 16px; }
  .slash { font-family: "Alfa Slab One", Georgia, serif; font-size: clamp(40px, 11vw, 64px); color: var(--chalk-soft); padding-bottom: 20px; }
  .tile {
    position: relative; background: var(--tile); color: var(--tile-ink);
    font-family: "Alfa Slab One", Georgia, "Times New Roman", serif;
    width: clamp(38px, 11vw, 62px); height: clamp(56px, 16vw, 88px);
    font-size: clamp(36px, 10.5vw, 62px); line-height: clamp(56px, 16vw, 88px);
    text-align: center; border-radius: 4px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.14);
  }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(0,0,0,.28); }
  .tile.pop { animation: pop .22s ease-out; }
  .dot { font-family: "Alfa Slab One", Georgia, serif; font-size: clamp(36px, 10vw, 56px); line-height: .8; color: var(--chalk); padding: 0 1px 6px; }
  @keyframes pop { 0% { transform: translateY(-6px); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tile.pop { animation: none; } }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0;
    border-top: 1px solid rgba(244,240,227,.35); border-bottom: 1px solid rgba(244,240,227,.35);
    margin-top: 6px;
  }
  .stat { padding: 10px 6px; text-align: center; border-right: 1px solid rgba(244,240,227,.2); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-size: 26px; font-weight: 700; color: var(--chalk); }
  .stat span { color: var(--chalk-soft); font-size: 15px; }

  .over { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .over-label { color: var(--chalk-soft); min-width: 7.5em; }
  .balls { display: flex; gap: 7px; flex-wrap: wrap; min-height: 38px; align-items: center; }
  .ball {
    min-width: 38px; height: 38px; padding: 0 6px; border-radius: 19px;
    display: grid; place-items: center; font-weight: 700; font-size: 18px;
    background: var(--chalk); color: var(--tile-ink);
  }
  .ball.zero { background: transparent; color: var(--chalk); border: 2px solid var(--chalk-soft); }
  .ball.boundary { background: var(--gold); }
  .ball.out { background: var(--wicket); color: #fff; }
  .ball.extra { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
  .none { color: var(--chalk-soft); }

  .banner {
    margin-top: 14px; padding: 10px 12px; background: rgba(0,0,0,.25);
    border-left: 4px solid var(--gold); font-size: 19px; font-weight: 600;
  }
  .banner[hidden] { display: none; }

  /* ---------- Controls ---------- */
  .controls { margin-top: 18px; background: var(--surface); border: 1px solid var(--surface-line); border-radius: 10px; padding: 16px; }
  .controls h2 { font-size: 18px; margin: 0 0 10px; font-weight: 700; }
  .runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .extras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  button, select {
    font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
    background: var(--btn); border: 2px solid var(--btn-line); border-radius: 8px;
    min-height: 54px; padding: 6px 8px; touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: var(--ink-soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .runs button { font-size: 26px; min-height: 64px; }
  .runs .four, .runs .six { background: var(--gold); border-color: #b48a1d; color: #1c1b16; }
  .extras .wkt { background: var(--wicket); border-color: #8d2b1a; color: #fff; }
  .setup { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--surface-line); }
  .setup label { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
  .setup select { min-height: 44px; }
  .spacer { flex: 1; }
  .setup button { min-height: 44px; }
  .hint { margin: 12px 0 0; color: var(--ink-soft); font-size: 15px; }
  .primary { background: var(--board); color: var(--chalk); border-color: var(--board-deep); }

  @media (max-width: 520px) {
    .runs { grid-template-columns: repeat(3, 1fr); }
    .extras { grid-template-columns: repeat(2, 1fr); }
    .innings-tag { margin-left: 0; width: 100%; }
    .spacer { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="frame">
    <section class="board" aria-label="Scoreboard">
      <h1 class="club">HT Cricket Club</h1>
      <div class="teams">
        <input class="team-input" id="teamA" aria-label="First team name" maxlength="18">
        <span class="v">v</span>
        <input class="team-input" id="teamB" aria-label="Second team name" maxlength="18">
        <span class="innings-tag" id="inningsTag"></span>
      </div>

      <div class="tiles-row" aria-live="polite">
        <div class="group"><div class="tiles" id="runsTiles"></div><div class="name">Runs</div></div>
        <div class="slash" aria-hidden="true">/</div>
        <div class="group"><div class="tiles" id="wktsTiles"></div><div class="name">Wickets</div></div>
        <div class="group"><div class="tiles" id="oversTiles"></div><div class="name" id="oversName">Overs</div></div>
      </div>

      <div class="stats">
        <div class="stat"><b id="crr">0.00</b><span>Run rate</span></div>
        <div class="stat"><b id="extrasN">0</b><span>Extras</span></div>
        <div class="stat"><b id="targetN">–</b><span id="targetLabel">Target</span></div>
        <div class="stat"><b id="needN">–</b><span id="needLabel">To win</span></div>
      </div>

      <div class="over">
        <div class="over-label" id="overLabel">Over 1</div>
        <div class="balls" id="balls"></div>
      </div>

      <div class="banner" id="banner" hidden></div>
    </section>
  </div>

  <section class="controls" aria-label="Update score">
    <h2>Record the ball</h2>
    <div class="runs" id="runBtns">
      <button data-run="0" aria-label="Dot ball, no run">0</button>
      <button data-run="1">1</button>
      <button data-run="2">2</button>
      <button data-run="3">3</button>
      <button data-run="4" class="four">4</button>
      <button data-run="6" class="six">6</button>
    </div>
    <div class="extras" id="extraBtns">
      <button data-extra="wd">Wide +1</button>
      <button data-extra="nb">No ball +1</button>
      <button data-extra="w" class="wkt">Wicket</button>
      <button id="undoBtn">Undo</button>
    </div>
    <p class="hint">Keys: 0 1 2 3 4 6 for runs, W for wicket, D for wide, N for no ball, U to undo.</p>

    <div class="setup">
      <label>Match length
        <select id="maxOvers" aria-label="Overs per innings">
          <option value="2">2 overs</option>
          <option value="5">5 overs</option>
          <option value="8" selected>8 overs</option>
          <option value="10">10 overs</option>
          <option value="20">20 overs</option>
          <option value="50">50 overs</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="nextInnings" class="primary" hidden>Start second innings</button>
      <button id="resetBtn">New match</button>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = "cricket-scoreboard-v1";
  var $ = function (id) { return document.getElementById(id); };

  var S = { names: ["Team A", "Team B"], maxOvers: 8, inn: 0, innings: [[], []] };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.names && d.innings && d.innings.length === 2) S = d;
      }
    } catch (e) { /* storage unavailable: start fresh */ }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // Derive every number from the ball-by-ball list, so undo is just "remove last ball".
  function calc(ev) {
    var r = { runs: 0, wkts: 0, legal: 0, extras: 0 };
    ev.forEach(function (e) {
      if (e.t === "run") { r.runs += e.r; r.legal++; }
      else if (e.t === "wd" || e.t === "nb") { r.runs += 1; r.extras += 1; }
      else if (e.t === "w") { r.wkts++; r.legal++; }
    });
    return r;
  }
  function target() { return S.inn === 1 ? calc(S.innings[0]).runs + 1 : null; }
  function isDone() {
    var c = calc(S.innings[S.inn]);
    if (c.wkts >= 10 || c.legal >= S.maxOvers * 6) return true;
    var t = target();
    return t !== null && c.runs >= t;
  }

  function oversText(legal) { return Math.floor(legal / 6) + "." + (legal % 6); }

  function drawTiles(el, text, animate) {
    var prev = el.getAttribute("data-v");
    el.setAttribute("data-v", text);
    el.setAttribute("aria-label", text);
    el.textContent = "";
    text.split("").forEach(function (ch, i) {
      var s = document.createElement("span");
      if (ch === ".") { s.className = "dot"; s.textContent = "."; }
      else {
        s.className = "tile";
        s.textContent = ch;
        var old = prev ? prev.charAt(i) : null;
        if (animate && old !== ch) s.classList.add("pop");
      }
      el.appendChild(s);
    });
  }

  function overGroups(ev) {
    var groups = [], cur = [], legal = 0;
    ev.forEach(function (e) {
      cur.push(e);
      if (e.t === "run" || e.t === "w") {
        legal++;
        if (legal % 6 === 0) { groups.push(cur); cur = []; }
      }
    });
    return { groups: groups, cur: cur, legal: legal };
  }

  function chip(e) {
    var d = document.createElement("div");
    d.className = "ball";
    if (e.t === "run") {
      d.textContent = e.r === 0 ? "•" : e.r;
      if (e.r === 0) d.classList.add("zero");
      if (e.r >= 4) d.classList.add("boundary");
    } else if (e.t === "wd") { d.textContent = "Wd"; d.classList.add("extra"); }
    else if (e.t === "nb") { d.textContent = "Nb"; d.classList.add("extra"); }
    else { d.textContent = "W"; d.classList.add("out"); }
    return d;
  }

  function render(animate) {
    var ev = S.innings[S.inn];
    var c = calc(ev);
    var done = isDone();
    var t = target();

    $("teamA").value = S.names[0];
    $("teamB").value = S.names[1];
    $("teamA").classList.toggle("batting", S.inn === 0);
    $("teamB").classList.toggle("batting", S.inn === 1);
    $("inningsTag").textContent = (S.inn === 0 ? "1st innings" : "2nd innings") + ", " + S.names[S.inn] + " batting";

    drawTiles($("runsTiles"), String(c.runs), animate);
    drawTiles($("wktsTiles"), String(c.wkts), animate);
    drawTiles($("oversTiles"), oversText(c.legal), animate);
    $("oversName").textContent = "Overs of " + S.maxOvers;

    $("crr").textContent = c.legal ? (c.runs / (c.legal / 6)).toFixed(2) : "0.00";
    $("extrasN").textContent = c.extras;

    if (t !== null) {
      var left = S.maxOvers * 6 - c.legal;
      $("targetN").textContent = t;
      $("targetLabel").textContent = "Target";
      $("needN").textContent = Math.max(t - c.runs, 0);
      $("needLabel").textContent = "off " + left + " balls";
    } else {
      var first = calc(S.innings[0]);
      $("targetN").textContent = "–";
      $("targetLabel").textContent = "Target";
      $("needN").textContent = "–";
      $("needLabel").textContent = "To win";
    }

    // This over
    var g = overGroups(ev);
    var show, label;
    if (g.cur.length === 0 && g.groups.length) {
      show = g.groups[g.groups.length - 1];
      label = "Over " + g.groups.length + " complete";
    } else {
      show = g.cur;
      label = "Over " + (g.groups.length + 1);
    }
    $("overLabel").textContent = label;
    var balls = $("balls");
    balls.textContent = "";
    if (!show.length) {
      var n = document.createElement("span");
      n.className = "none"; n.textContent = "No balls yet";
      balls.appendChild(n);
    } else show.forEach(function (e) { balls.appendChild(chip(e)); });

    // Banner and controls
    var banner = $("banner");
    var next = $("nextInnings");
    next.hidden = true;
    banner.hidden = true;
    if (done) {
      banner.hidden = false;
      if (S.inn === 0) {
        banner.textContent = S.names[1] + " need " + (c.runs + 1) + " to win.";
        next.hidden = false;
      } else {
        var f = calc(S.innings[0]);
        if (c.runs >= f.runs + 1) banner.textContent = S.names[1] + " won by " + (10 - c.wkts) + " wicket" + (10 - c.wkts === 1 ? "" : "s") + ".";
        else if (c.runs === f.runs) banner.textContent = "Match tied.";
        else banner.textContent = S.names[0] + " won by " + (f.runs - c.runs) + " run" + (f.runs - c.runs === 1 ? "" : "s") + ".";
      }
    }
    var btns = document.querySelectorAll("[data-run], [data-extra]");
    for (var i = 0; i < btns.length; i++) btns[i].disabled = done;
    $("undoBtn").disabled = ev.length === 0 && !(S.inn === 1);
    $("maxOvers").value = String(S.maxOvers);
    $("maxOvers").disabled = S.inn === 1 || S.innings[1].length > 0;
    save();
  }

  function add(e) {
    if (isDone()) return;
    S.innings[S.inn].push(e);
    render(true);
  }

  function undo() {
    var ev = S.innings[S.inn];
    if (ev.length) { ev.pop(); }
    else if (S.inn === 1) { S.inn = 0; }   // step back into the first innings
    render(true);
  }

  // Buttons
  document.querySelectorAll("[data-run]").forEach(function (b) {
    b.addEventListener("click", function () { add({ t: "run", r: parseInt(b.getAttribute("data-run"), 10) }); });
  });
  document.querySelectorAll("[data-extra]").forEach(function (b) {
    b.addEventListener("click", function () { add({ t: b.getAttribute("data-extra") }); });
  });
  $("undoBtn").addEventListener("click", undo);

  $("nextInnings").addEventListener("click", function () { S.inn = 1; render(true); });

  $("maxOvers").addEventListener("change", function (e) {
    S.maxOvers = parseInt(e.target.value, 10);
    render(false);
  });

  ["teamA", "teamB"].forEach(function (id, i) {
    $(id).addEventListener("input", function (e) {
      S.names[i] = e.target.value || ("Team " + (i ? "B" : "A"));
      $("inningsTag").textContent = (S.inn === 0 ? "1st innings" : "2nd innings") + ", " + S.names[S.inn] + " batting";
      save();
    });
    $(id).addEventListener("change", function () { render(false); });
  });

  // Two-tap reset (confirm dialogs are unreliable inside embedded pages)
  var resetTimer = null;
  $("resetBtn").addEventListener("click", function () {
    var b = $("resetBtn");
    if (!resetTimer) {
      b.textContent = "Tap again to reset";
      resetTimer = setTimeout(function () { b.textContent = "New match"; resetTimer = null; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null;
    b.textContent = "New match";
    S.inn = 0; S.innings = [[], []];
    render(false);
  });

  // Keyboard shortcuts
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if ("012346".indexOf(k) !== -1 && k.length === 1) add({ t: "run", r: parseInt(k, 10) });
    else if (k === "w") add({ t: "w" });
    else if (k === "d") add({ t: "wd" });
    else if (k === "n") add({ t: "nb" });
    else if (k === "u") undo();
  });

  load();
  render(false);
})();
</script>
</body>
</html>
